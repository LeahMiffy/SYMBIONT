<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SYMBIONT — a living specimen that never holds still</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void: #0b0e14;
    --void-2: #10141d;
    --paper: #e8e3d8;
    --paper-dim: #b9b3a4;
    --moss: #2e3b36;
    --moss-line: #445048;
    --rust: #b5652d;
    --rust-bright: #d97a3a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--void);
    color:var(--paper);
    font-family:'IBM Plex Mono', monospace;
    overflow:hidden;
  }
  #stage{ position:fixed; inset:0; width:100%; height:100%; display:block; cursor:crosshair; }

  .veil{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:var(--void); z-index:50; transition:opacity .6s ease;
    flex-direction:column; gap:14px;
  }
  .veil .sigil{ font-family:'Fraunces', serif; font-size:15px; letter-spacing:.35em; text-transform:uppercase; color:var(--paper-dim); }
  .veil .bar{ width:180px; height:1px; background:var(--moss-line); position:relative; overflow:hidden; }
  .veil .bar::after{ content:''; position:absolute; inset:0; width:40%; background:var(--rust); animation:scan 1.1s ease-in-out infinite; }
  @keyframes scan{ 0%{ transform:translateX(-100%);} 100%{ transform:translateX(350%);} }

  header{
    position:fixed; top:0; left:0; right:0; z-index:10;
    display:flex; align-items:baseline; justify-content:space-between;
    padding:22px 28px; pointer-events:none;
  }
  header .title{
    font-family:'Fraunces', serif; font-style:italic; font-weight:500;
    font-size:22px; letter-spacing:.02em; color:var(--paper);
    text-shadow:0 0 20px rgba(0,0,0,.6);
  }
  header .title small{
    display:block; font-family:'IBM Plex Mono', monospace; font-style:normal;
    font-size:10px; letter-spacing:.28em; text-transform:uppercase; color:var(--paper-dim);
    margin-top:4px;
  }
  header .gen{
    font-size:11px; letter-spacing:.15em; text-transform:uppercase; color:var(--paper-dim);
    text-align:right;
  }
  header .gen b{ color:var(--rust-bright); font-weight:600; }

  .card{
    position:fixed; left:28px; bottom:28px; z-index:10;
    width:300px; max-width:calc(100vw - 56px);
    background:rgba(16,20,29,0.72);
    border:1px solid var(--moss-line);
    backdrop-filter:blur(6px);
    padding:16px 18px 14px;
  }
  .card .tag{
    font-size:9px; letter-spacing:.3em; text-transform:uppercase; color:var(--rust-bright);
    margin-bottom:8px;
  }
  .dna{
    font-size:11px; line-height:1.7; color:var(--paper-dim);
    letter-spacing:.02em; word-break:break-all;
  }
  .dna b{ color:var(--paper); font-weight:500; }

  .hint{ margin-top:12px; font-size:9.5px; color:var(--paper-dim); line-height:1.5; }

  @media (max-width:640px){
    header{ flex-direction:column; gap:4px; padding:16px; }
    .card{ left:16px; right:16px; bottom:16px; width:auto; }
  }
</style>
</head>
<body>

  <div class="veil" id="veil">
    <div class="sigil">Waking the specimen</div>
    <div class="bar"></div>
  </div>

  <canvas id="stage"></canvas>

  <header>
    <div class="title">Symbiont<small>a living specimen that never holds still</small></div>
  </header>

  <div class="card">
    <div class="tag">Specimen readout — live</div>
    <div class="dna" id="dnaReadout">reading...</div>
    <div class="hint">Move, drift, or click near it — the specimen reacts to your presence in real time, then settles again once you look away.</div>
  </div>

<script>
(() => {
  "use strict";

  // ---------- canvas setup ----------
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  let W, H, DPR;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- seeded PRNG + value noise ----------
  function mulberry32(a){
    return function(){
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function makeNoise(seed){
    const rand = mulberry32(seed);
    const perm = new Uint8Array(512);
    const p = new Uint8Array(256);
    for (let i=0;i<256;i++) p[i]=i;
    for (let i=255;i>0;i--){ const j = Math.floor(rand()*(i+1)); const t=p[i]; p[i]=p[j]; p[j]=t; }
    for (let i=0;i<512;i++) perm[i]=p[i&255];
    function fade(t){ return t*t*t*(t*(t*6-15)+10); }
    function lerp(a,b,t){ return a+t*(b-a); }
    function grad(hash,x,y){
      const h = hash & 7;
      const u = h<4 ? x : y, v = h<4 ? y : x;
      return ((h&1)?-u:u) + ((h&2)?-2*v:2*v);
    }
    return function noise(x,y){
      const X = Math.floor(x)&255, Y = Math.floor(y)&255;
      x -= Math.floor(x); y -= Math.floor(y);
      const u = fade(x), v = fade(y);
      const aa = perm[X+perm[Y]], ab = perm[X+perm[Y+1]];
      const ba = perm[X+1+perm[Y]], bb = perm[X+1+perm[Y+1]];
      return lerp(
        lerp(grad(aa,x,y), grad(ba,x-1,y), u),
        lerp(grad(ab,x,y-1), grad(bb,x-1,y-1), u),
        v
      );
    };
  }

  // ---------- genome ----------
  const RANGE = {
    hue:        [0, 360],
    hueSpread:  [15, 170],
    branch:     [0.6, 5.5],
    flow:       [0.4, 4.2],
    density:    [110, 460],
    decay:      [0.025, 0.14],
    sat:        [38, 92],
    light:      [38, 66],
    symmetry:   [1, 6],
  };
  function clamp(v,[lo,hi]){ return Math.max(lo, Math.min(hi, v)); }
  function defaultGenome(){
    return {
      hue: 205, hueSpread: 60, branch: 2.2, flow: 1.3,
      density: 220, decay: 0.055, sat: 68, light: 52,
      symmetry: 2, seed: Math.floor(Math.random()*99999),
      generation: 0
    };
  }

  let noiseFn = makeNoise(1);
  let base = null;          // the specimen's baseline genome for this visit only — nothing is ever saved
  let live = null;          // base + live session delta (what's rendered)
  let particles = [];

  // ---------- particles ----------
  function spawnParticles(n){
    const arr = [];
    for (let i=0;i<n;i++){
      arr.push({
        x: Math.random()*W, y: Math.random()*H,
        life: Math.random()*200 + 60,
        age: Math.random()*200,
        hueJ: (Math.random()-0.5)
      });
    }
    return arr;
  }

  function rebuildForGenome(g){
    noiseFn = makeNoise(g.seed);
    particles = spawnParticles(Math.round(g.density));
  }

  // ---------- session interaction tracking ----------
  const session = {
    lastX: null, lastY: null, lastT: performance.now(),
    speedSum: 0, speedN: 0,
    angleSamples: [],
    clicks: 0,
    active: false
  };

  function trackPointer(x,y){
    const now = performance.now();
    if (session.lastX !== null){
      const dt = Math.max(now - session.lastT, 1);
      const dx = x - session.lastX, dy = y - session.lastY;
      const dist = Math.hypot(dx,dy);
      const speed = dist / dt; // px/ms
      session.speedSum += Math.min(speed, 3);
      session.speedN++;
      const angle = Math.atan2(dy,dx);
      session.angleSamples.push(angle);
      if (session.angleSamples.length > 40) session.angleSamples.shift();
      session.active = true;
    }
    session.lastX = x; session.lastY = y; session.lastT = now;
  }

  canvas.addEventListener('mousemove', e => trackPointer(e.clientX, e.clientY));
  canvas.addEventListener('touchmove', e => {
    if (e.touches[0]) trackPointer(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:true});
  canvas.addEventListener('click', e => {
    session.clicks++;
    burst(e.clientX, e.clientY);
  });
  canvas.addEventListener('touchstart', e => {
    if (e.touches[0]){ session.clicks++; burst(e.touches[0].clientX, e.touches[0].clientY); }
  }, {passive:true});

  let burstsQueue = [];
  function burst(x,y){
    burstsQueue.push({x,y,t:performance.now()});
  }

  function angleVariance(samples){
    if (samples.length < 4) return 0;
    let sx=0, sy=0;
    for (const a of samples){ sx += Math.cos(a); sy += Math.sin(a); }
    const n = samples.length;
    const R = Math.hypot(sx,sy)/n;
    return clamp(1 - R, [0,1]); // 0 = moving in one direction, 1 = chaotic
  }

  function computeLiveDelta(){
    const avgSpeed = session.speedN ? clamp(session.speedSum/session.speedN, [0,3])/3 : 0;
    const variance = angleVariance(session.angleSamples);
    const clicks = session.clicks;
    return {
      hue: (variance - 0.45) * 70,
      hueSpread: (avgSpeed - 0.3) * 55,
      branch: (variance - 0.4) * 3.2,
      flow: (avgSpeed - 0.3) * 2.6,
      density: clicks * 14,
      decay: (avgSpeed > 0.55 ? -1 : 1) * 0.012,
      sat: clicks > 0 ? Math.min(clicks * 3, 18) : 0,
      light: (avgSpeed - 0.3) * 8,
      symmetryShift: clicks >= 5 ? Math.floor(clicks/5) : 0,
      _avgSpeed: avgSpeed, _variance: variance, _clicks: clicks
    };
  }

  function applyDelta(g, d, strength){
    const out = {...g};
    out.hue        = ((clamp(g.hue + d.hue*strength, [-999,999]) % 360) + 360) % 360;
    out.hueSpread   = clamp(g.hueSpread + d.hueSpread*strength, RANGE.hueSpread);
    out.branch      = clamp(g.branch + d.branch*strength, RANGE.branch);
    out.flow        = clamp(g.flow + d.flow*strength, RANGE.flow);
    out.density     = clamp(g.density + d.density*strength, RANGE.density);
    out.decay       = clamp(g.decay + d.decay*strength, RANGE.decay);
    out.sat         = clamp(g.sat + d.sat*strength, RANGE.sat);
    out.light       = clamp(g.light + d.light*strength, RANGE.light);
    if (d.symmetryShift) out.symmetry = clamp(g.symmetry + (strength>0.5?d.symmetryShift:0), RANGE.symmetry);
    return out;
  }

  // ---------- rendering ----------
  let t = 0;
  function draw(){
    requestAnimationFrame(draw);
    if (!live) return;
    t += 0.006 * live.flow;

    ctx.fillStyle = `rgba(11,14,20,${live.decay})`;
    ctx.fillRect(0,0,W,H);

    ctx.globalCompositeOperation = 'lighter';

    const cx = W/2, cy = H/2;
    const sym = Math.max(1, Math.round(live.symmetry));
    const targetCount = Math.round(live.density);
    while (particles.length < targetCount) particles.push({
      x: Math.random()*W, y: Math.random()*H, life: 150+Math.random()*150, age:0, hueJ:(Math.random()-0.5)
    });
    if (particles.length > targetCount) particles.length = targetCount;

    for (const p of particles){
      p.age++;
      if (p.age > p.life){
        p.x = Math.random()*W; p.y = Math.random()*H; p.age = 0; p.life = 150+Math.random()*150;
      }
      const n = noiseFn(p.x*0.0022*live.branch, p.y*0.0022*live.branch + t);
      const angle = n * Math.PI * 2 * live.branch;
      const speed = 0.6 + Math.abs(n)*1.6;
      p.x += Math.cos(angle) * speed;
      p.y += Math.sin(angle) * speed;
      if (p.x < 0) p.x += W; if (p.x > W) p.x -= W;
      if (p.y < 0) p.y += H; if (p.y > H) p.y -= H;

      const lifeRatio = p.age / p.life;
      const alpha = Math.sin(lifeRatio * Math.PI) * 0.85;
      const hue = (live.hue + n*live.hueSpread + p.hueJ*live.hueSpread*0.4 + 360) % 360;
      const col = `hsla(${hue}, ${live.sat}%, ${live.light}%, ${alpha})`;
      ctx.fillStyle = col;

      for (let s=0; s<sym; s++){
        const ang0 = (Math.PI*2/sym)*s;
        const dx = p.x - cx, dy = p.y - cy;
        const rot = Math.atan2(dy,dx) + ang0;
        const dist = Math.hypot(dx,dy);
        const rx = cx + Math.cos(rot)*dist;
        const ry = cy + Math.sin(rot)*dist;
        ctx.beginPath();
        ctx.arc(rx, ry, 1.15, 0, Math.PI*2);
        ctx.fill();
      }
    }

    const now = performance.now();
    burstsQueue = burstsQueue.filter(b => now - b.t < 900);
    for (const b of burstsQueue){
      const age = (now - b.t)/900;
      const r = age * 90;
      ctx.strokeStyle = `hsla(${live.hue}, ${live.sat}%, ${Math.min(live.light+20,80)}%, ${(1-age)*0.5})`;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.arc(b.x, b.y, r, 0, Math.PI*2);
      ctx.stroke();
    }

    ctx.globalCompositeOperation = 'source-over';
  }

  // ---------- UI ----------
  const dnaReadout = document.getElementById('dnaReadout');

  function fmtGene(v, decimals=2){ return Number(v).toFixed(decimals); }

  function renderDNA(g){
    dnaReadout.innerHTML =
      `H<b>${Math.round(g.hue)}°</b> · Δh<b>${fmtGene(g.hueSpread,0)}</b> · ` +
      `branch<b>${fmtGene(g.branch)}</b> · flow<b>${fmtGene(g.flow)}</b><br>` +
      `density<b>${Math.round(g.density)}</b> · sym<b>×${Math.round(g.symmetry)}</b> · ` +
      `sat<b>${Math.round(g.sat)}%</b> · fade<b>${fmtGene(g.decay,3)}</b>`;
  }

  // ---------- main loop: recompute live genome from session each tick ----------
  function tickLive(){
    if (base){
      const d = computeLiveDelta();
      live = applyDelta(base, d, 1);
      rebuildDensityOnly(live);
      renderDNA(live);
    }
    requestAnimationFrame(tickLive);
  }
  let lastParticleTarget = 0;
  function rebuildDensityOnly(g){
    // noise field is only rebuilt once, at boot (seed-based); density is handled per-frame in the draw loop
  }

  // ---------- boot ----------
  function boot(){
    const g = defaultGenome();
    base = g;
    live = {...g};
    rebuildForGenome(live);
    renderDNA(live);

    document.getElementById('veil').style.opacity = '0';
    setTimeout(()=> document.getElementById('veil').style.display='none', 650);

    requestAnimationFrame(draw);
    requestAnimationFrame(tickLive);
  }

  boot();
})();
</script>
</body>
</html>
